<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Roost</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { width: 340px; padding: 14px; display: grid; gap: 12px; }
    header { display: flex; align-items: center; gap: 8px; }
    header h1 { font-size: 15px; }
    .total { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
    .stats { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
    .stats .sub { text-align: right; font-size: 12px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .bf { display: grid; gap: 7px; }
    .bf .row { font-size: 12px; }
    ul.recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    ul.recent li a { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 8px; margin: 0 -8px; border-radius: 7px; text-decoration: none; }
    ul.recent li a:hover { background: var(--surface); }
    ul.recent .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    ul.recent .when { color: var(--muted); font-size: 11.5px; }
    h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin-bottom: 4px; }
    footer { display: flex; gap: 14px; font-size: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="../icons/icon48.png" alt="" />
    <h1>Roost</h1>
    <span class="spacer"></span>
    <span id="status" class="pill"><span class="dot"></span><span id="statusText">…</span></span>
  </header>

  <div id="alert" class="alert" hidden></div>

  <section class="stats">
    <div>
      <div class="total" id="total">–</div>
      <div class="muted">posts archived</div>
    </div>
    <div class="sub muted" id="syncInfo"></div>
  </section>

  <section class="card bf" id="backfill" hidden>
    <div class="row"><strong id="bfTitle">Full archive</strong><span class="spacer"></span><button class="link" id="bfToggle"></button></div>
    <div class="bar" id="bfBar"><i></i></div>
    <div class="row muted" id="bfInfo"></div>
  </section>

  <section class="actions">
    <button class="primary" id="syncBtn">Sync now</button>
    <button id="saveBtn" title="Save the post open in this tab (with its thread)">Save this post</button>
  </section>

  <section id="recentWrap" hidden>
    <h2>Recently saved</h2>
    <ul class="recent" id="recent"></ul>
  </section>

  <footer>
    <a href="#" id="openDb">Open in Notion ↗</a>
    <a href="#" id="openOptions">Settings</a>
    <span class="spacer"></span>
    <a href="#" id="openLog">Activity</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
